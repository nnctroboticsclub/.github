name: 不具合を報告
description: 再現手順と実行環境を添えて不具合を報告します。
body:
  - type: markdown
    attributes:
      value: |
        既存の Issue を確認してから報告してください。
        投稿先の公開範囲を確認し、未公開の機体・大会資料を公開の報告に含めないでください。
        ログや設定に認証情報・秘密鍵・個人情報を含めないでください。
        脆弱性や漏えいの疑いは、対象の SECURITY.md または管理者への既存の非公開連絡手段で相談してください。
  - type: input
    id: version
    attributes:
      label: 使用バージョン
      description: タグ・コミット番号など。分からない場合は、その旨を記載してください。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 実行環境
      description: OS・ツールのバージョン。組み込みの場合はボード・MCU、PlatformIO 環境名、配線・周辺機器も記載してください。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: 実行したコマンドと、再現する最小限のコード・設定を記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
      description: ビルド時の問題か、実機での問題かも記載してください。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 関連ログ
      description: エラーの前後を含むログがあれば貼り付けてください。
      render: text
